server:
  port: 8080

spring:
  application:
    name: medtracker-backend
  datasource:
    url: jdbc:h2:mem:medtrackerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:demo-key}
      chat:
        options:
          model: ${AI_MODEL:gpt-4o-mini}
          temperature: 0.3

app:
  jwt:
    secret: medtrackerSecretKeyMustBeAtLeast32BytesForHmacSha256Security123456
    expiration-ms: 86400000
